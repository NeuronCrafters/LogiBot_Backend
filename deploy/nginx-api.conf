# Dedicated origin for https://api.saellogibot.com.
# Issue the certificate using the HTTP-only bootstrap described in README.md first.
server {
    listen 80;
    listen [::]:80;
    server_name api.saellogibot.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.saellogibot.com;
    ssl_certificate /etc/letsencrypt/live/api.saellogibot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.saellogibot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:43187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
}
