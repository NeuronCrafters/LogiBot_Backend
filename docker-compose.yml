services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-43187}:${PORT:-43187}"
    env_file: .env
    environment:
      NODE_ENV: production
      RAG_UPLOAD_DIR: /var/logibots/uploads/rag
    volumes:
      - rag_uploads:/var/logibots/uploads/rag
    depends_on:
      - worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-43187}/health/simple"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      RAG_UPLOAD_DIR: /var/logibots/uploads/rag
    volumes:
      - rag_uploads:/var/logibots/uploads/rag
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${RAG_WORKER_PORT:-43188}/health/simple"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      NODE_ENV: test

volumes:
  rag_uploads:
