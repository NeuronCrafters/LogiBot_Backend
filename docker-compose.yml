services:
  mongodb:
    image: mongo:latest
    container_name: logibot_mongodb
    ports:
      - "27017:27017"
    restart: always

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER_ADMIN}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD_ROOT}

    volumes:
      - mongo-data:/data/db
      - /home/usuario/mongodb_backups:/backup

    networks:
      - logibot-network

  backend:
    container_name: logibot_backend
    #image: ghcr.io/ramoncbarbosa/logibot_backend:latest
    build: .
    ports:
      - "3000:3000"

    depends_on:
      - mongodb

    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_USER_ADMIN: ${MONGO_USER_ADMIN}
      MONGO_PASSWORD_ROOT: ${MONGO_PASSWORD_ROOT}
      DB_NAME: ${DB_NAME}
      SESSION_SECRET: ${SESSION_SECRET}
      API_KEY: ${API_KEY}
      FRONT_URL: ${FRONT_URL}
      GHCR_PAT: ${GHCR_PAT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_LOGIN_CALLBACK_URL: ${GOOGLE_LOGIN_CALLBACK_URL}
      GOOGLE_LOGIN_REDIRECT: ${GOOGLE_LOGIN_REDIRECT}
      JWT_SECRET: ${JWT_SECRET}
      SSH_HOST: ${SSH_HOST}
      SSH_KEY: ${SSH_KEY}
      SSH_USERNAME: ${SSH_USERNAME}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_PORT: ${SMTP_PORT}
      RASA: ${RASA}
      RASA_ACTION: ${RASA_ACTION}
      RASA_API: ${RASA_API}
      OLLAMA_COOKIE: ${OLLAMA_COOKIE}
      OLLAMA_API_URL_1: ${OLLAMA_API_URL_1}
