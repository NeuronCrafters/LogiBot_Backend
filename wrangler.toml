name = "logibot-backend"
main = "src/index.ts"
compatibility_date = "2026-05-31"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
NODE_ENV = "production"
FRONT_URL = "https://saellogibot.com"
COOKIE_DOMAIN = ".saellogibot.com"
CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"

[ai]
binding = "AI"
